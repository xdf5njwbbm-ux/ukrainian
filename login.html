<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ukrainian AI Tutor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index_files/styles.css?v=10.0">
    <style>
        body {
            background: #040a1e;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #0a1f4d 0%, #040a1e 100%);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .auth-logo .flag {
            font-size: 2.5rem;
        }

        .auth-logo h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .auth-tagline {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .auth-card h2 {
            font-size: 2rem;
            margin: 0 0 12px;
            font-weight: 700;
        }

        .auth-card p {
            color: rgba(255, 255, 255, 0.6);
            margin: 0 0 32px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 20px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #0057b8;
            box-shadow: 0 0 0 4px rgba(0, 87, 184, 0.2);
        }

        .form-group .show-pwd {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-btn {
            width: 100%;
            background: #0057b8;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .auth-btn:hover {
            background: #004694;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 87, 184, 0.4);
        }

        .forgot-link {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .social-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .social-btn img {
            width: 32px;
            height: 32px;
        }

        .social-btn.apple {
            background: #000;
            color: #fff;
        }

        .auth-footer {
            text-align: center;
            margin-top: 40px;
        }

        .auth-footer p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .auth-footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .text-yellow {
            color: #ffd700;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }

            .auth-logo h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <header class="auth-header">
        <div class="auth-logo">
            <span class="flag">🇺🇦</span>
            <h1 style="color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px rgba(0, 87, 184, 0.2);">
                Ukrainian AI <span class="text-yellow"
                    style="text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);">Tutor</span>
            </h1>
        </div>
        <div class="auth-tagline">
            <span>Powered by AI</span>
            <span>Built for real conversations</span>
        </div>
    </header>

    <main class="auth-card">
        <h2><span style="color: #fff;">Continue your AI</span> <span class="text-yellow"
                style="text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);">conversation</span></h2>
        <p>Your AI tutor is waiting to hear from you.</p>

        <form>
            <div class="form-group">
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required id="password">
                <span class="show-pwd" onclick="togglePassword()">Show</span>
            </div>
            <button type="submit" class="auth-btn">
                Start Speaking <span>➔</span>
            </button>
        </form>

        <a href="#" class="forgot-link">Forgot password?</a>
        <div class="divider">or</div>

        <div class="social-btns">
            <a href="#" class="social-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
            </a>
            <a href="#" class="social-btn apple">
                <svg width="32" height="32" viewBox="0 0 384 512" fill="currentColor">
                    <path
                        d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                </svg>
            </a>
        </div>
    </main>

    <footer class="auth-footer">
        <p>Not a member yet?</p>
        <a href="index_files/chat.html">Start your AI Ukrainian journey today <span>➔</span></a>
    </footer>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const showBtn = document.querySelector('.show-pwd');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                showBtn.textContent = 'Hide';
            } else {
                pwd.type = 'password';
                showBtn.textContent = 'Show';
            }
        }
    </script>
</body>

</html>
