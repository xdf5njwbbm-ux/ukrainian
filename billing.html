<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subscription & Billing | Learn Ukrainian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index_files/styles.css?v=27.0">
    <style>
        :root {
            --app-bg: #071a2b;
            --app-nav-bg: #071a2b;
            --app-accent: #ffd700;
            --app-primary: #0057b8;
            --app-text: #ffffff;
            --app-text-dim: rgba(255, 255, 255, 0.7);
            --header-gradient: linear-gradient(to bottom, #071a2b, #0057b8);
        }

        body {
            background: var(--app-bg);
            color: var(--app-text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .top-glow-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .page-header {
            background: var(--header-gradient);
            padding: 60px 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .page-title {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        main {
            padding: 24px 20px 40px;
        }

        /* Current Plan Card */
        .plan-status-card {
            background: linear-gradient(135deg, rgba(0, 87, 184, 0.3), rgba(0, 87, 184, 0.1));
            border: 1px solid rgba(0, 87, 184, 0.4);
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .plan-status-card::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--app-accent);
            opacity: 0.1;
            filter: blur(60px);
            border-radius: 50%;
        }

        .current-plan-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--app-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .plan-name {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .plan-price {
            font-size: 18px;
            font-weight: 600;
            color: var(--app-text-dim);
            margin-bottom: 24px;
        }

        .plan-details {
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--app-text-dim);
            font-weight: 600;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 700;
        }

        /* Section Titles */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 32px 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Payment Method */
        .payment-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .card-brand {
            width: 50px;
            height: 32px;
            background: #fff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #1a1a1a;
            font-size: 12px;
        }

        .card-numbers {
            font-weight: 600;
            font-size: 16px;
        }

        .btn-text {
            color: var(--app-accent);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        /* History Table */
        .history-list {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-item {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .invoice-date {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .invoice-status {
            font-size: 12px;
            color: #2ed573;
            font-weight: 700;
            text-transform: uppercase;
        }

        .invoice-amount {
            font-weight: 800;
            font-size: 16px;
        }

        /* Action Buttons */
        .billing-actions {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-billing {
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-billing:active {
            transform: scale(0.98);
        }

        .btn-upgrade {
            background: var(--app-primary);
            color: var(--app-accent);
            border: 1px solid var(--app-accent);
        }

        .btn-cancel {
            color: var(--app-text-dim);
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="top-glow-line"></div>

    <header class="page-header">
        <div class="back-btn" onclick="location.href='profile.html'">←</div>
        <h1 class="page-title">Subscription</h1>
    </header>

    <main>
        <div class="plan-status-card">
            <span class="current-plan-label">Active Plan</span>
            <h2 class="plan-name">Fluency Plan</h2>
            <p class="plan-price">$39.99 / month</p>

            <div class="plan-details">
                <div class="detail-item">
                    <span class="detail-label">Renewal Date</span>
                    <span class="detail-value">March 14, 2026</span>
                </div>
                <div class="detail-item" style="text-align: right;">
                    <span class="detail-label">Status</span>
                    <span class="detail-value" style="color: #2ed573;">Active</span>
                </div>
            </div>
        </div>

        <h3 class="section-title">Payment Method</h3>
        <div class="payment-card">
            <div class="card-info">
                <div class="card-brand">VISA</div>
                <div class="card-numbers">•••• 4242</div>
            </div>
            <span class="btn-text">Edit</span>
        </div>

        <h3 class="section-title">Billing History</h3>
        <div class="history-list">
            <div class="history-item">
                <div>
                    <div class="invoice-date">Feb 14, 2026</div>
                    <div class="invoice-status">Paid</div>
                </div>
                <div class="invoice-amount">$39.99</div>
            </div>
            <div class="history-item">
                <div>
                    <div class="invoice-date">Jan 14, 2026</div>
                    <div class="invoice-status">Paid</div>
                </div>
                <div class="invoice-amount">$39.99</div>
            </div>
            <div class="history-item">
                <div>
                    <div class="invoice-date">Dec 14, 2025</div>
                    <div class="invoice-status">Paid</div>
                </div>
                <div class="invoice-amount">$39.99</div>
            </div>
        </div>

        <div class="billing-actions">
            <div class="btn-billing btn-upgrade">Upgrade to Annual (Save 20%)</div>
            <div class="btn-billing btn-cancel"
                onclick="alert('In a real app, this would start the cancellation process.')">Cancel Subscription</div>
        </div>
    </main>
</body>

</html>
