<!DOCTYPE html>
<html>
<head>
  <title>AI Tutor Test</title>
</head>
<body>

<h2>Ukrainian AI Tutor Test</h2>

<div id="chatBox" style="margin-bottom:20px;"></div>

<input id="userInput" placeholder="Type something in Ukrainian..." />
<button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {
  const message = document.getElementById("userInput").value;

  const response = await fetch("https://grantcraft355.app.n8n.cloud/webhook/ukr-chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message })
  });

  const data = await response.json();

  document.getElementById("chatBox").innerHTML += 
    "<p><b>You:</b> " + message + "</p>";

  document.getElementById("chatBox").innerHTML += 
    "<p><b>AI:</b> " + data.reply + "</p>";
}
</script>

</body>
</html>
