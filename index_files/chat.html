<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-body, system-ui, -apple-system, Arial);
            background: #071a2d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            overflow: hidden;
            /* Prevent page-level scrolling */
        }

        .chat-container {
            width: 800px;
            max-width: 95vw;
            height: 900px;
            max-height: 90vh;
            background: #0b2542;
            /* Matching the site's dark blue */
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, .6);
            border: 2px solid rgba(255, 255, 255, .1);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                width: calc(100% - 20px);
                height: 85dvh;
                /* Safer height for mobile browsers and keyboards */
                max-width: 100vw;
                max-height: 100dvh;
                border-radius: 24px;
                margin: 10px;
                border: 1px solid rgba(255, 255, 255, .1);
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div id="vf-chat" style="width: 100%; height: 100%;">
            <!-- Voiceflow chat will be embedded here -->
        </div>
    </div>

    <script type="text/javascript">
        (function (d, t) {
            var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
            v.onload = function () {
                window.voiceflow.chat.load({
                    verify: { projectID: '699c84e4d035fc070381058c' },
                    url: 'https://general-runtime.voiceflow.com',
                    versionID: 'production',
                    voice: {
                        url: "https://runtime-api.voiceflow.com"
                    },
                    render: {
                        mode: 'embedded',
                        target: document.getElementById('vf-chat')
                    }
                });
            }
            v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
        })(document, 'script');
    </script>
</body>

</html>
